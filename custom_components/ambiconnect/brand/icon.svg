<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173247"/>
      <stop offset="1" stop-color="#0d1e2c"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5670"/>
      <stop offset="1" stop-color="#1f3f54"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bg)"/>

  <!-- wallbox body -->
  <rect x="76" y="46" width="104" height="166" rx="20" fill="url(#box)" stroke="#4a8aab" stroke-width="3"/>

  <!-- status LED -->
  <circle cx="128" cy="68" r="7" fill="#5fd0a0"/>

  <!-- charging port -->
  <circle cx="128" cy="188" r="12" fill="#0d1e2c" stroke="#4a8aab" stroke-width="3"/>
  <circle cx="128" cy="188" r="4" fill="#4a8aab"/>

  <!-- X mark -->
  <g>
    <rect x="78" y="112" width="100" height="24" rx="12" fill="#ffb020" transform="rotate(45 128 124)"/>
    <rect x="78" y="112" width="100" height="24" rx="12" fill="#ffb020" transform="rotate(-45 128 124)"/>
  </g>
</svg>
